<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preposition Pal 📚</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3e;
      --accent: #7c5cd8;
      --accent2: #a78bfa;
      --user-bubble: #7c5cd8;
      --bot-bubble: #22222f;
      --text: #e8e8f0;
      --muted: #8888a8;
      --green: #34d399;
      --radius: 18px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .avatar {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), #3b82d4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .header-info p  { font-size: 12px; color: var(--muted); }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Messages ── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
    .msg-row.bot  { margin-right: auto; }

    .bubble-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #3b82d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      max-width: 100%;
      word-break: break-word;
      line-height: 1.55;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* ── Markdown rendering inside bubbles ── */
    .bubble strong { color: var(--accent2); font-weight: 700; }
    .bubble em     { color: #c4b5fd; font-style: italic; }
    .bubble code   { background: #12121a; padding: 1px 5px; border-radius: 4px; font-size: 13px; color: var(--green); }
    .bubble table  { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .bubble th { background: var(--surface2); color: var(--accent2); }
    .bubble ol, .bubble ul { padding-left: 18px; margin-top: 4px; }
    .bubble li { margin-bottom: 3px; }
    .bubble p  { margin-bottom: 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { color: var(--accent2); margin: 6px 0 4px; }

    /* ── Typing indicator ── */
    #typing {
      display: none;
      align-items: flex-end;
      gap: 8px;
      max-width: 82%;
      margin-right: auto;
    }
    .typing-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Quick replies ── */
    #quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 10px;
    }
    .qr-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .qr-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Input bar ── */
    #input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 18px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color .2s;
    }
    #user-input::placeholder { color: var(--muted); }
    #user-input:focus { border-color: var(--accent); }

    #send-btn {
      width: 42px; height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    #send-btn:hover { background: #6d4dc7; }
    #send-btn:active { transform: scale(.92); }
    #send-btn svg { fill: #fff; width: 18px; height: 18px; }

    /* ── Responsive ── */
    @media (min-width: 640px) {
      #chat { padding: 24px calc(50% - 300px); }
      #quick-replies { padding: 0 calc(50% - 300px) 10px; }
      #input-bar { padding: 14px calc(50% - 300px); }
      header { padding: 14px calc(50% - 300px); }
    }
  </style>
</head>
<body>

<header>
  <div class="avatar">📚</div>
  <div class="header-info">
    <h1>Preposition Pal</h1>
    <p>English Tutor · Academic Support</p>
  </div>
  <div class="status-dot" title="Online"></div>
</header>

<div id="chat"></div>

<div id="typing">
  <div class="bubble-avatar">📚</div>
  <div class="typing-bubble">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<div id="quick-replies"></div>

<div id="input-bar">
  <textarea id="user-input" rows="1" placeholder="Ask me anything about English…"></textarea>
  <button id="send-btn" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  /* ── Minimal Markdown renderer ── */
  function renderMd(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      // tables
      .replace(/^\|(.+)\|$/gm, row => '<tr>' + row.slice(1,-1).split('|').map(c=>`<td>${c.trim()}</td>`).join('') + '</tr>')
      .replace(/(<tr>.*<\/tr>\n)+/gs, match => {
        const rows = match.trim().split('\n');
        const header = rows[0].replace(/<td>/g,'<th>').replace(/<\/td>/g,'</th>');
        const body = rows.slice(2).join('\n');
        return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
      })
      // headings
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^# (.+)$/gm,'<h1>$1</h1>')
      // bold / italic / code
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code>$1</code>')
      // ordered / unordered lists
      .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
      .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>\n*)+/g, match => `<ul>${match}</ul>`)
      // line breaks → paragraphs
      .split(/\n{2,}/).map(block =>
        block.startsWith('<') ? block : `<p>${block.replace(/\n/g,'<br>')}</p>`
      ).join('');
  }

  const chat = document.getElementById('chat');
  const input = document.getElementById('user-input');
  const typing = document.getElementById('typing');
  const qrContainer = document.getElementById('quick-replies');

  const QUICK_REPLIES = [
    'Explain prepositions 📌',
    'Explain tenses ⏰',
    'Practice questions ✏️',
    'Help with essays 📝',
    'Explain conditionals 🔀',
  ];

  function showQuickReplies() {
    qrContainer.innerHTML = '';
    QUICK_REPLIES.forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        qrContainer.innerHTML = '';
        sendMessage(label);
      });
      qrContainer.appendChild(btn);
    });
  }

  function appendMessage(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    if (role === 'bot') {
      const av = document.createElement('div');
      av.className = 'bubble-avatar'; av.textContent = '📚';
      row.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = role === 'bot' ? renderMd(text) : renderMd(text);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function setTyping(on) {
    typing.style.display = on ? 'flex' : 'none';
    if (on) chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;
    appendMessage('user', text);
    input.value = '';
    input.style.height = 'auto';
    qrContainer.innerHTML = '';
    setTyping(true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
        credentials: 'same-origin',
      });
      const data = await res.json();
      setTyping(false);
      appendMessage('bot', data.reply);
      if (data.showQuickReplies) showQuickReplies();
    } catch {
      setTyping(false);
      appendMessage('bot', 'Oops — something went wrong. Please try again!');
    }
  }

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Send on Enter (Shift+Enter = newline)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });
  document.getElementById('send-btn').addEventListener('click', () => sendMessage(input.value));

  // Greeting on load
  window.addEventListener('load', () => {
    appendMessage('bot', "Hey! 👋 I'm **Preposition Pal**, your English tutor.\n\nI can help you with:\n- 📖 Explaining English grammar topics\n- 🔢 Step-by-step breakdowns\n- ✏️ Practice questions\n\nWhat topic do you need help with today?");
    showQuickReplies();
  });
</script>
</body>
</html>
